dataset:
  name: "QuickBooks Online"
  granularity: "entity"          # multi-entity accounting dataset
  mode: "transactional"          # transaction-level data from REST API
  source: "quickbooks_api"       # data fetched via QuickBooks IDS Query API
  source_endpoint: "/api/query"   # QuickBooks IDS Query API endpoint

# ──────────────────────────────────────────────
# Entity: Account (Chart of Accounts)
# ──────────────────────────────────────────────
entities:
  Account:
    fields:
      id: id
      sync_token: sync_token
      domain: domain
      sparse: sparse
      name: name
      fully_qualified_name: fully_qualified_name
      description: description
      active: active
      classification: classification
      account_type: account_type
      account_sub_type: account_sub_type
      sub_account: sub_account
      parent_ref_value: parent_ref_value
      current_balance: current_balance
      current_balance_with_sub_accounts: current_balance_with_sub_accounts
      currency_ref_value: currency_ref_value
      currency_ref_name: currency_ref_name
      meta_data_create_time: meta_data_create_time
      meta_data_last_updated_time: meta_data_last_updated_time
    types:
      id: VARCHAR
      sync_token: VARCHAR
      domain: VARCHAR
      sparse: BOOLEAN
      name: VARCHAR
      fully_qualified_name: VARCHAR
      description: VARCHAR
      active: BOOLEAN
      classification: VARCHAR
      account_type: VARCHAR
      account_sub_type: VARCHAR
      sub_account: BOOLEAN
      parent_ref_value: VARCHAR
      current_balance: DOUBLE
      current_balance_with_sub_accounts: DOUBLE
      currency_ref_value: VARCHAR
      currency_ref_name: VARCHAR
      meta_data_create_time: VARCHAR
      meta_data_last_updated_time: VARCHAR
    valid_values:
      classification: ["Asset", "Liability", "Equity", "Revenue", "Expense"]
      account_type:
        - "Bank"
        - "Accounts Receivable"
        - "Other Current Asset"
        - "Fixed Asset"
        - "Other Asset"
        - "Accounts Payable"
        - "Credit Card"
        - "Other Current Liability"
        - "Long Term Liability"
        - "Equity"
        - "Income"
        - "Cost of Goods Sold"
        - "Expense"
        - "Other Income"
        - "Other Expense"
    synonyms:
      account: [chart of accounts, ledger account, GL account, coa]
      balance: [account balance, current balance]
      classification: [account classification, account category]

