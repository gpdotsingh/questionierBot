dataset:
  name: "CRM Donor Simulation"
  granularity: "donor"        # donor | transaction
  mode: "summary"             # donor-level summary (not one-row-per-donation)

fields:                        # map logical -> physical column/field names
  donor_id: "DonorID"
  first_name: "FirstName"
  last_name: "LastName"
  email: "Email"
  phone: "Phone"
  city: "City"
  state: "State"
  zip_code: "ZipCode"
  last_donation_date: "LastDonationDate"
  total_gifts: "TotalGifts"
  total_amount_donated: "TotalAmountDonated"
  event_participation: "EventParticipation"
  engagement_score: "EngagementScore"

types:                         # expected types after ingestion
  DonorID: string
  FirstName: string
  LastName: string
  Email: string
  Phone: string
  City: string
  State: string               # 2-letter code (uppercased)
  ZipCode: int
  LastDonationDate: date      # parsed from M/D/YYYY
  TotalGifts: int
  TotalAmountDonated: double
  EventParticipation: string  # "Yes" | "No"
  EngagementScore: int

transforms:                    # normalize on load / before analytics
  - name: parse_last_donation_date
    field: LastDonationDate
    from_format: "%m/%d/%Y"    # e.g., "9/3/2024"
    to: date
  - name: normalize_state_to_upper
    field: State
    to_upper: true
    trim: true
  - name: coerce_numbers
    fields:
      - TotalGifts
      - TotalAmountDonated
      - EngagementScore
    on_error: null
  - name: event_participation_bool
    source: EventParticipation
    target: EventParticipationBool
    mapping: { "Yes": true, "No": false }

derived_fields:
  last_donation_month:
    expr: date_trunc("month", LastDonationDate)   # for monthly rollups
  days_since_last_donation:
    expr: date_diff("day", LastDonationDate, now())

query_hints:                   # handy snippets you used in Atlas
  case_insensitive_state_match: |
    { "$match": { "$expr": { "$eq": [ { "$toUpper": "$State" }, "CA" ] } } }
  active_last_90_days_match: |
    { "$match": { "LastDonationDate": { "$gte": { "$dateSubtract": { "startDate": "$$NOW", "unit": "day", "amount": 90 } } } } }

indexes:                       # suggested MongoDB indexes
  - { State: 1, EngagementScore: -1 }
  - { LastDonationDate: 1 }
  - { TotalAmountDonated: -1 }

metrics:                       # names your pipeline/orchestrator can reference
  donor_count_last_n_days:
    definition: "Distinct DonorID with LastDonationDate >= NOW - N days"
  median_per_donor_total_last_n_days:
    definition: "Median of per-donor TotalAmountDonated among donors active in last N days (summary proxy)"
  engagement_score_stats:
    definition: "avg/min/max/median of EngagementScore"

synonyms:
  total donation: [donation amount, total amount donated, lifetime donation, total_donation_amount]
  activity: [engagement, engagement score, engagement_score]
  region: [state, location, province]
  donors: [supporters, contributors]

meta:
  source_type: "csv"
  source_path: "data/CRM_Donor_Simulation_Dataset.csv"
  notes:
    - "Data is donor-level summary; monthly totals of donations are a proxy if grouped by LastDonationDate month."
    - "Prefer true transaction/gift-level data for exact period sums."