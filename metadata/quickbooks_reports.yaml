      - overdue bills
      - past due bills
      - bills due
      - bills due soon
      - unpaid bills
      - open bills
      - outstanding bills
      - bills with balance
    query_sequence:
      Q1:
        text: "select * from Bill"
        filter: "balance > 0"
        children: []

  # ─────────────────────────────────────────────────────────────────────────
  # FULL FINANCIAL OVERVIEW (multi-report)
  # ─────────────────────────────────────────────────────────────────────────
  FinancialOverview:
    api_name: null
    description: >
      Complete financial health snapshot: P&L + Balance Sheet + Cash Flow
      in a single request. Three report queries fired in sequence.
    category: financial_statement
    synonyms:
      - financial overview
      - full financial report
      - financial health
      - complete financial summary
      - company financials
      - how is the company doing financially
      - full financial picture
    query_sequence:
      Q1:
        text: "report:ProfitAndLoss"
        filter: "date_macro=This_Fiscal_Year"
        children: []
      Q2:
        text: "report:BalanceSheet"
        filter: "date_macro=Today"
        children: []
      Q3:
        text: "report:CashFlow"
        filter: "date_macro=This_Fiscal_Year"
        children: []

