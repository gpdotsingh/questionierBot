    api_name: ProfitAndLoss
    description: >
      Revenue for the current month with last quarter context for comparison.
      Two queries ensure meaningful output even if the current month has no
      transactions yet.
    category: financial_statement
    synonyms:
      - revenue this month
      - income this month
      - sales this month
      - how much did we make this month
      - this month revenue
      - this month income
      - current month revenue
