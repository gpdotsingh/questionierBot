  # PROFIT AND LOSS DETAIL
  # ─────────────────────────────────────────────────────────────────────────
  ProfitAndLossDetail:
    api_name: ProfitAndLossDetail
    description: >
      Detailed income statement showing every individual transaction
      (invoice, sales receipt, bill, expense, etc.) that makes up each
      income and expense line item. Includes transaction date, type, number,
      customer/vendor name, memo, and amount.
    category: financial_statement
    synonyms:
