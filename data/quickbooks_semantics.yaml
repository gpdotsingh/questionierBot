version: 1

dataset:
  name: quickbooks_online
  description: >
    Multi-entity accounting data from QuickBooks Online. Entities include
    Account, Customer, Vendor, Employee, Item, Invoice, Estimate, SalesReceipt,
    CreditMemo, RefundReceipt, Payment, Bill, BillPayment, PurchaseOrder,
    Purchase, Deposit, JournalEntry, TimeActivity, Term, PaymentMethod,
    TaxAgency, TaxRate, TaxCode, Department, CompanyInfo, ExchangeRate,
    Preferences, Transfer, VendorCredit, Class, Budget, Attachable.
  granularity: entity
  source: quickbooks_api

dimensions:
  # ---- Master entities ----
  account_id:
    column: id
    type: string
    synonyms: ["account id", "gl id", "account number"]
  account_name:
    column: name
    type: string
    synonyms: ["account", "gl account", "ledger account"]
  account_type:
    column: account_type
    type: categorical
    synonyms: ["type of account", "account category"]
    values:
      - "Bank"
      - "Accounts Receivable"
      - "Other Current Asset"
      - "Fixed Asset"
      - "Other Asset"
      - "Accounts Payable"
      - "Credit Card"
      - "Other Current Liability"
      - "Long Term Liability"
      - "Equity"
      - "Income"
      - "Cost of Goods Sold"
      - "Expense"
      - "Other Income"
      - "Other Expense"
  account_classification:
    column: classification
    type: categorical
    synonyms: ["account classification", "account category"]
    values: ["Asset", "Liability", "Equity", "Revenue", "Expense"]
  account_balance:
    column: current_balance
    type: double
    synonyms: ["account balance", "current balance", "gl balance"]
  invoice_total:
    column: total_amt
    type: double
    synonyms: ["invoice amount", "invoice total", "total amount"]
  invoice_balance:
    column: balance
    type: double
    synonyms: ["unpaid balance", "outstanding amount", "amount due"]
  invoice_status:
    column: email_status
    type: categorical
    values: ["NeedToSend", "EmailSent", "NotSet"]
  customer_name:
    column: display_name
    type: string
    synonyms: ["client name", "buyer", "customer"]
  customer_balance:
    column: balance
    type: double
    synonyms: ["open balance", "outstanding balance", "amount owed"]
  vendor_name:
    column: display_name
    type: string
    synonyms: ["supplier", "provider", "seller"]
  vendor_balance:
    column: balance
    type: double
    synonyms: ["vendor balance", "amount owed to vendor"]
  employee_name:
    column: display_name
    type: string
    synonyms: ["worker", "staff member", "team member"]
  item_type:
    column: type
    type: categorical
    values: ["Service", "Inventory", "NonInventory", "Bundle", "Group"]
  item_price:
    column: unit_price
    type: double
    synonyms: ["unit price", "selling price", "rate"]
  billable_status:
    column: billable_status
    type: categorical
    values: ["Billable", "NotBillable", "HasBeenBilled"]
  estimate_status:
    column: txn_status
    type: categorical
    values: ["Accepted", "Closed", "Pending", "Rejected"]
  payment_type:
    column: payment_type
    type: categorical
    values: ["Cash", "Check", "CreditCard"]
  po_status:
    column: po_status
    type: categorical
    values: ["Open", "Closed"]
  pay_type:
    column: pay_type
    type: categorical
    values: ["Check", "CreditCard"]
  payment_method_type:
    column: type
    type: categorical
    values: ["CREDIT_CARD", "NON_CREDIT_CARD"]
  bill_balance:
    column: balance
    type: double
    synonyms: ["unpaid bill", "ap balance", "amount owed to vendor"]
  txn_date:
    column: txn_date
    type: date
    synonyms: ["transaction date", "date", "posting date"]
  due_date:
    column: due_date
    type: date
    synonyms: ["payment due date", "due by"]

entities:
  # ──────────────────────────────────────────────
  # Entity: Account (Chart of Accounts)
  # ──────────────────────────────────────────────
  Account:
    fields:
      - id
      - sync_token
      - domain
      - sparse
      - name
      - fully_qualified_name
      - description
      - active
      - classification
      - account_type
      - account_sub_type
      - sub_account
      - parent_ref_value
      - current_balance
      - current_balance_with_sub_accounts
      - currency_ref_value
      - currency_ref_name
      - meta_data_create_time
      - meta_data_last_updated_time
    synonyms:
      account: [chart of accounts, ledger account, GL account, coa]
      balance: [account balance, current balance]
      classification: [account classification, account category]
    dimensions:
      - id
      - name
      - classification
      - account_type
      - account_sub_type
      - active
      - sub_account
      - parent_ref_value
      - currency_ref_value
    measures:
      - current_balance
      - current_balance_with_sub_accounts

