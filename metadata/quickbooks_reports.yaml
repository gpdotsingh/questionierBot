# ══════════════════════════════════════════════════════════════════════════════
# QuickBooks Online — Report Catalog
# ══════════════════════════════════════════════════════════════════════════════
#
# Each report entry defines:
#   api_name        : QB Reports API report name (used in report:<api_name>)
#   description     : What the report shows
#   synonyms        : Natural-language phrases a user might say to request it
#   category        : Grouping (financial_statement, receivables, payables, etc.)
#   query_sequence  : Ready-to-use orchestrator output (Q1..Qn).
#                     Each Qn has: text, filter, children — matches the exact
#                     JSON the orchestrator LLM produces. At runtime, just look
#                     up the report and fire these queries — no LLM needed.
#   params          : Available filter parameters and their options
#   output_sections : Key sections/rows visible in the report output
#
# Query format:
#   IDS queries  → text: "select * from <Entity>", filter: "<WHERE clause>"
#   Report calls → text: "report:<ReportName>",     filter: "<key=value pairs>"
#
# ══════════════════════════════════════════════════════════════════════════════

reports:

  # ─────────────────────────────────────────────────────────────────────────
  # PROFIT AND LOSS (Income Statement)
  # ─────────────────────────────────────────────────────────────────────────
  ProfitAndLoss:
    api_name: ProfitAndLoss
    description: >
      Income statement showing total revenue, cost of goods sold, gross profit,
      operating expenses, and net income/loss for a given period.
    category: financial_statement
    synonyms:
      - profit and loss
      - P&L
      - income statement
      - earnings report
      - revenue report
      - revenue summary
      - net income
      - net profit
      - net loss
      - income and expenses
      - income vs expenses
      - how much did we make
      - how much did we earn
      - total sales
      - total revenue
      - total income
      - total expenses
      - operating income
      - gross profit
      - earnings
      - financial performance
      - how is the business doing
    query_sequence:
      Q1:
        text: "report:ProfitAndLoss"
        filter: "date_macro=Last_Fiscal_Quarter"
        children: []
    params:
      date_macro:
        description: "Predefined date range"
        options:
          - This_Month
          - Last_Month
          - This_Fiscal_Quarter
          - Last_Fiscal_Quarter
          - This_Fiscal_Year
          - Last_Fiscal_Year
          - This_Week
          - Last_Week
          - Today
      start_date:
        description: "Custom start date (YYYY-MM-DD), alternative to date_macro"
      end_date:
        description: "Custom end date (YYYY-MM-DD)"
      accounting_method:
        description: "Accrual or Cash basis"
        options: [Accrual, Cash]
        default: Accrual
      summarize_column_by:
        description: "Break down columns by dimension"
        options: [Total, Month, Week, Days, Quarter, Year, Customers, Vendors, Classes, Departments, Employees, ProductsAndServices]
    output_sections:
      - Income (by category)
      - Cost of Goods Sold
      - Gross Profit
      - Expenses (by category)
      - Net Operating Income
      - Other Income/Expense
      - Net Income
    variants:
      ProfitAndLossByMonth:
        synonyms:
          - P&L by month
          - monthly P&L
          - monthly income statement
          - income by month
          - expenses by month
          - monthly profit and loss
          - month over month revenue
          - monthly revenue breakdown
          - monthly financial summary
        query_sequence:
          Q1:
            text: "report:ProfitAndLoss"
            filter: "date_macro=This_Fiscal_Year summarize_column_by=Month"
            children: []
      ProfitAndLossByCustomer:
        synonyms:
          - P&L by customer
          - profit by customer
          - revenue by customer
          - income by customer
          - customer profitability
          - customer revenue breakdown
          - which customer is most profitable
          - customer-wise P&L
          - per-customer income
          - customer earnings
        query_sequence:
          Q1:
            text: "report:ProfitAndLoss"
            filter: "date_macro=This_Fiscal_Year summarize_column_by=Customers"
            children: []
      ProfitAndLossComparison:
        synonyms:
          - P&L comparison
          - compare P&L
          - profit and loss vs last year
          - year over year P&L
          - P&L YoY
          - income comparison
          - compare income statement
          - how does this year compare
          - revenue comparison
          - this year vs last year profit
        query_sequence:
          Q1:
            text: "report:ProfitAndLoss"
            filter: "date_macro=This_Fiscal_Year"
            children: []
          Q2:
            text: "report:ProfitAndLoss"
            filter: "date_macro=Last_Fiscal_Year"
            children: []
      ProfitAndLossByTagGroup:
        synonyms:
          - P&L by tag
          - P&L by tag group
          - profit by tag
          - income by tag
          - tag-wise P&L
          - profit and loss by category tag
          - tagged income statement
        query_sequence:
          Q1:
            text: "report:ProfitAndLoss"
            filter: "date_macro=This_Fiscal_Year summarize_column_by=ProductsAndServices"
            children: []

