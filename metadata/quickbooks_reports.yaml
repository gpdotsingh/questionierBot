      - what do we own
      - what do we owe
      - company worth
      - total assets
      - total liabilities
      - equity position
      - book value
    query_sequence:
      Q1:
        text: "report:BalanceSheet"
        filter: "date_macro=Today"
        children: []
    params:
      date_macro:
        description: "As-of date"
        options: [Today, Last_Month, This_Fiscal_Quarter, Last_Fiscal_Quarter, This_Fiscal_Year, Last_Fiscal_Year]
